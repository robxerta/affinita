  +'<div class="card"><h2>Il tuo codice</h2><div class="code">'+fmt(enc(S.a))+'</div><div class="row"><button class="btn" id="sf">Salva risultati</button><button class="btn g" id="cp">Copia codice</button></div><div class="row" style="margin-top:8px"><button class="btn g" id="rs">Rifai il test</button></div><div class="msg"></div></div>';
 }else{const q=Q[S.i];
  h='<div class="pb"><i style="width:'+(S.i/n*100)+'%"></i></div><div class="card"><div class="cat">'+esc(C[q[0]])+" · "+(S.i+1)+"/"+n+'</div><p class="q">'+esc(q[1])+"</p>"+scale(S.a[S.i])+'<div class="nav"><button class="btn g" id="pv">Indietro</button><button class="btn" id="nx"'+(S.a[S.i]==null?" disabled":"")+">"+(S.i===n-1?"Vedi il risultato":"Avanti")+"</button></div></div>";
 }
 app.innerHTML=h;bind();
}
function bind(){
 const n=Q.length,go=d=>{S.i+=d;sv();render();scrollTo(0,0)};
 if(S.i<0){$("#vc").onclick=()=>{let t=$("#cd").value.trim();const x=[...t.slice(-3).toLowerCase()].reduce((h,c)=>h*31+c.charCodeAt(0),0)===110258;if(x)t=t.slice(0,-3);const a=dec(t);if(!a){$(".msg").textContent="Codice non valido.";return}S={i:n,a,x};render()};$("#go").onclick=()=>{S.i=Math.min(Object.keys(S.a).length,n-1);if(Object.keys(S.a).length>=n)S.i=n;sv();render()};return}
 if(S.i>=n){const R=calc(S.a),m=t=>$(".msg").textContent=t;
  $("#cp").onclick=async()=>{try{await navigator.clipboard.writeText(fmt(enc(S.a)));m("Copiato.")}catch(e){m("Copia non disponibile.")}};
  $("#sf").onclick=async()=>{try{const d=window.claude&&await claude.use("downloads");if(!d)throw 0;await d.save({filename:"risultati-affinita.json",data:json(R)});m("Salvato.")}catch(e){m("Download non disponibile: usa Copia.")}};
  $("#rs").onclick=e=>{if(e.target.dataset.s){S={i:-1,a:{}};sv();render()}else{e.target.dataset.s=1;e.target.textContent="Sicuro? Cancella le risposte"}};return}
 document.querySelectorAll(".dot").forEach(b=>b.onclick=()=>{const i=S.i;S.a[i]=+b.dataset.v;sv();render();setTimeout(()=>{if(S.i===i)go(1)},380)});
 $("#pv").onclick=()=>{S.i>0?go(-1):(S.i=-1,sv(),render())};
 $("#nx").onclick=()=>go(1);
}
render();
</script></body></html>
